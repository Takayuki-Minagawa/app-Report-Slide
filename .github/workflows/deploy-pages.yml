name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Prepare static artifact
        run: |
          artifact_dir=dist/pages
          mkdir -p "$artifact_dir"
          cp -a dist/client/. "$artifact_dir/"

          if [ -n "$GITHUB_PAGES_BASE_PATH" ]; then
            nested_asset_dir="$artifact_dir$GITHUB_PAGES_BASE_PATH"
            test -d "$nested_asset_dir"
            find "$nested_asset_dir" -mindepth 1 -maxdepth 1 -exec mv {} "$artifact_dir/" \;
            rmdir "$nested_asset_dir"
          fi

          test -f "$artifact_dir/index.html"
          test -d "$artifact_dir/_next"
          touch "$artifact_dir/.nojekyll"
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist/pages

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
